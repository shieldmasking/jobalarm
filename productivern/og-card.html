<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Card — ProductivRN QBL Alerts</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #1a4a8a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* ── Background texture — subtle diagonal lines ── */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 28px
    );
    pointer-events: none;
  }

  /* ── Right-side visual: teal rings ── */
  .rings {
    position: absolute;
    right: -60px;
    top: 50%;
    transform: translateY(-50%);
    width: 520px;
    height: 520px;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(14, 107, 107, 0.35);
    animation: pulse 3s ease-out infinite;
  }
  .ring:nth-child(1) { animation-delay: 0s;    transform: scale(1);    border-color: rgba(14,107,107,.7); border-width: 3px; }
  .ring:nth-child(2) { animation-delay: 0.8s;  transform: scale(1.18); border-color: rgba(14,107,107,.45); }
  .ring:nth-child(3) { animation-delay: 1.6s;  transform: scale(1.38); border-color: rgba(14,107,107,.25); }
  .ring:nth-child(4) { animation-delay: 2.2s;  transform: scale(1.58); border-color: rgba(14,107,107,.12); }

  @keyframes pulse {
    0%   { opacity: 0; transform: scale(var(--s, 1)); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: scale(calc(var(--s, 1) + 0.15)); }
  }

  .ring-core {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #0e8080, #0e6b6b 55%, #0a4f4f);
    box-shadow: 0 0 60px rgba(14,107,107,.5), 0 0 120px rgba(14,107,107,.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring-core-inner {
    width: 44%;
    height: 44%;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Heartbeat line inside core */
  .ecg {
    width: 70%;
    height: 2px;
    background: rgba(255,255,255,.6);
    position: relative;
    overflow: visible;
  }
  .ecg::before {
    content: '';
    position: absolute;
    top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 28px solid rgba(255,255,255,.7);
  }

  /* ── Left content pane ── */
  .content {
    position: absolute;
    left: 0; top: 0;
    width: 680px;
    height: 630px;
    padding: 52px 56px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-block { }
  .brand-name {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,.6);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .brand-product {
    font-size: 52px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    margin-top: 4px;
    letter-spacing: -1px;
  }
  .brand-product span {
    color: #4ecdc4;
  }

  .headline-block { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px 0 16px; }
  .headline {
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -.5px;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 19px;
    font-weight: 400;
    color: #b8d4f0;
    line-height: 1.5;
    max-width: 540px;
  }

  /* ── Stats bar ── */
  .stats {
    display: flex;
    gap: 10px;
  }
  .stat {
    flex: 1;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat-num {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-lbl {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,.6);
    line-height: 1.3;
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  /* ── Domain ── */
  .domain {
    position: absolute;
    bottom: 20px;
    right: 28px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.35);
    letter-spacing: .5px;
  }

  /* ── Accent line ── */
  .accent-line {
    position: absolute;
    left: 0; top: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(180deg, #4ecdc4 0%, #0e6b6b 100%);
  }
</style>
</head>
<body>

<div class="accent-line"></div>

<!-- Right visual -->
<div class="rings">
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring-core">
    <div class="ring-core-inner">
      <div class="ecg"></div>
    </div>
  </div>
</div>

<!-- Left content -->
<div class="content">
  <div class="brand-block">
    <div class="brand-name">ProductivRN</div>
    <div class="brand-product">QBL <span>Alerts</span></div>
  </div>

  <div class="headline-block">
    <div class="headline">Real-Time Hemorrhage Alerts<br>for Labor &amp; Delivery</div>
    <div class="subtitle">Instant QBL notifications to your entire OB team.<br>AWHONN &amp; ACOG compliant.</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">#1</div>
      <div class="stat-lbl">Cause of Preventable Maternal Death</div>
    </div>
    <div class="stat">
      <div class="stat-num">&lt; 60s</div>
      <div class="stat-lbl">Alert Delivery Time</div>
    </div>
    <div class="stat">
      <div class="stat-num">Compliant</div>
      <div class="stat-lbl">AWHONN &amp; ACOG Guidelines</div>
    </div>
  </div>
</div>

<div class="domain">qblalerts.com</div>

</body>
</html>
