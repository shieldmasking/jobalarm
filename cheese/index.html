<html>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XBE4R8QS4C');

 <script type="text/javascript">

function initialize() {
        navigator.geolocation.getCurrentPosition(
          goJobAlarm,
          noJobAlarm,
          { timeout: 15000, enableHighAccuracy: false }
        );
      }

function goJobAlarm(position) {
	const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    window.location.replace('https://www.jobalarm.biz/m.php?a=126&lat=' + lat + '&lon=' + lon + '&b=7');
  }

function noJobAlarm() {
    window.location.replace("https://www.jobalarm.biz/m.php?a=126&b=7&z=75063");
  }

</script>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #f5f5f5; }
  button { padding: 18px 36px; font-size: 20px; background: #2d6cb4; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
  </head>
  <body>
    <button onclick="initialize()">Find Jobs Near Me</button>
  </body>
</html>
